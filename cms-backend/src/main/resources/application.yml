spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  threads:
    virtual:
      enabled: true

app:
  jwt:
    secret: ${JWT_SECRET}
    access-token-expire-minutes: ${ACCESS_TOKEN_EXPIRE_MINUTES:60}
    device-token-expire-days: ${DEVICE_TOKEN_EXPIRE_DAYS:365}
  aws:
    region: ${AWS_REGION:ap-south-1}
    s3:
      bucket: ${S3_BUCKET_NAME}
      presigned-upload-expire-seconds: ${PRESIGNED_UPLOAD_EXPIRE_SECONDS:900}
      presigned-download-expire-seconds: ${PRESIGNED_DOWNLOAD_EXPIRE_SECONDS:86400}
  media:
    max-upload-size-mb: ${MAX_UPLOAD_SIZE_MB:500}
    allowed-image-types: image/jpeg,image/png,image/webp,image/gif
    allowed-video-types: video/mp4,video/webm
  cors:
    allowed-origins: ${ALLOWED_ORIGINS:http://localhost:3000}
  analytics:
    impression-batch-size: ${IMPRESSION_BATCH_SIZE:500}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
