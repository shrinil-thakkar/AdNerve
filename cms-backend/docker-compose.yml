version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: cms_db
      POSTGRES_USER: cms_user
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cms_user -d cms_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/cms_db
      DATABASE_USERNAME: cms_user
      DATABASE_PASSWORD: secret
      SPRING_PROFILES_ACTIVE: default
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
